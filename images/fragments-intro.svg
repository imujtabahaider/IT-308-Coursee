<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="14" viewBox="0 0 640 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="640" height="300" rx="12" fill="#f5f7fa" stroke="#d9e0e8"/><text x="320" y="30" text-anchor="middle" fill="#14213d" font-weight="700" font-size="16">One Activity screen made of two Fragments</text><rect x="60" y="50" width="520" height="230" rx="12" fill="#fff" stroke="#14213d" stroke-width="2" stroke-dasharray="6 4"/><text x="75" y="72" text-anchor="start" fill="#14213d" font-weight="700">Activity (shopping app screen)</text><rect x="80" y="86" width="190" height="175" rx="8" fill="#d7efe9" stroke="#1f7a6d" stroke-width="2"/><text x="175" y="110" text-anchor="middle" fill="#1f7a6d" font-weight="700">Fragment A</text><text x="175" y="132" text-anchor="middle" fill="#14213d">Product categories</text><text x="175" y="158" text-anchor="middle" fill="#52606f">Phones</text><text x="175" y="184" text-anchor="middle" fill="#52606f">Laptops</text><text x="175" y="210" text-anchor="middle" fill="#52606f">Watches</text><text x="175" y="236" text-anchor="middle" fill="#52606f">Headphones</text><rect x="290" y="86" width="270" height="175" rx="8" fill="#fdf0cf" stroke="#e0a21c" stroke-width="2"/><text x="425" y="110" text-anchor="middle" fill="#9a6b00" font-weight="700">Fragment B</text><text x="425" y="132" text-anchor="middle" fill="#14213d">Product details</text><text x="425" y="162" text-anchor="middle" fill="#52606f">Name, price, photo,</text><text x="425" y="186" text-anchor="middle" fill="#52606f">description, Buy button</text></svg>