<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="14" viewBox="0 0 640 588" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#14213d"/></marker></defs><rect width="640" height="588" rx="12" fill="#f5f7fa" stroke="#d9e0e8"/><text x="320" y="28" text-anchor="middle" fill="#14213d" font-weight="700" font-size="16">Fragment lifecycle (simplified order)</text><rect x="60" y="50" width="200" height="32" rx="8" fill="#fff" stroke="#14213d" stroke-width="2"/><text x="160" y="71" text-anchor="middle" fill="#14213d" font-weight="700">onAttach()</text><text x="280" y="71" text-anchor="start" fill="#52606f" font-size="13">Attached to the host Activity</text><line x1="160" y1="82" x2="160" y2="94" stroke="#14213d" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="94" width="200" height="32" rx="8" fill="#fff" stroke="#14213d" stroke-width="2"/><text x="160" y="115" text-anchor="middle" fill="#14213d" font-weight="700">onCreate()</text><text x="280" y="115" text-anchor="start" fill="#52606f" font-size="13">Initialize data (non-UI)</text><line x1="160" y1="126" x2="160" y2="138" stroke="#14213d" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="138" width="200" height="32" rx="8" fill="#fff" stroke="#14213d" stroke-width="2"/><text x="160" y="159" text-anchor="middle" fill="#14213d" font-weight="700">onCreateView()</text><text x="280" y="159" text-anchor="start" fill="#52606f" font-size="13">Create the UI: inflate the XML layout</text><line x1="160" y1="170" x2="160" y2="182" stroke="#14213d" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="182" width="200" height="32" rx="8" fill="#fff" stroke="#14213d" stroke-width="2"/><text x="160" y="203" text-anchor="middle" fill="#14213d" font-weight="700">onViewCreated()</text><text x="280" y="203" text-anchor="start" fill="#52606f" font-size="13">Initialize views, set click listeners</text><line x1="160" y1="214" x2="160" y2="226" stroke="#14213d" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="226" width="200" height="32" rx="8" fill="#fff" stroke="#1f7a6d" stroke-width="2"/><text x="160" y="247" text-anchor="middle" fill="#1f7a6d" font-weight="700">onStart()</text><text x="280" y="247" text-anchor="start" fill="#52606f" font-size="13">Fragment becomes visible</text><line x1="160" y1="258" x2="160" y2="270" stroke="#14213d" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="270" width="200" height="32" rx="8" fill="#fff" stroke="#1f7a6d" stroke-width="2"/><text x="160" y="291" text-anchor="middle" fill="#1f7a6d" font-weight="700">onResume()</text><text x="280" y="291" text-anchor="start" fill="#52606f" font-size="13">Active: user can interact</text><line x1="160" y1="302" x2="160" y2="314" stroke="#14213d" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="314" width="200" height="32" rx="16" fill="#eef1f5" stroke="#9aa7b5" stroke-width="2"/><text x="160" y="335" text-anchor="middle" fill="#52606f">User interacts</text><text x="280" y="335" text-anchor="start" fill="#52606f" font-size="13"></text><line x1="160" y1="346" x2="160" y2="358" stroke="#14213d" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="358" width="200" height="32" rx="8" fill="#fff" stroke="#e0a21c" stroke-width="2"/><text x="160" y="379" text-anchor="middle" fill="#e0a21c" font-weight="700">onPause()</text><text x="280" y="379" text-anchor="start" fill="#52606f" font-size="13">Losing active state (another screen in front)</text><line x1="160" y1="390" x2="160" y2="402" stroke="#14213d" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="402" width="200" height="32" rx="8" fill="#fff" stroke="#e0a21c" stroke-width="2"/><text x="160" y="423" text-anchor="middle" fill="#e0a21c" font-weight="700">onStop()</text><text x="280" y="423" text-anchor="start" fill="#52606f" font-size="13">No longer visible</text><line x1="160" y1="434" x2="160" y2="446" stroke="#14213d" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="446" width="200" height="32" rx="8" fill="#fff" stroke="#c0504d" stroke-width="2"/><text x="160" y="467" text-anchor="middle" fill="#c0504d" font-weight="700">onDestroyView()</text><text x="280" y="467" text-anchor="start" fill="#52606f" font-size="13">View destroyed; Fragment object may remain</text><line x1="160" y1="478" x2="160" y2="490" stroke="#14213d" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="490" width="200" height="32" rx="8" fill="#fff" stroke="#c0504d" stroke-width="2"/><text x="160" y="511" text-anchor="middle" fill="#c0504d" font-weight="700">onDestroy()</text><text x="280" y="511" text-anchor="start" fill="#52606f" font-size="13">The Fragment itself is destroyed</text><line x1="160" y1="522" x2="160" y2="534" stroke="#14213d" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="534" width="200" height="32" rx="8" fill="#fff" stroke="#c0504d" stroke-width="2"/><text x="160" y="555" text-anchor="middle" fill="#c0504d" font-weight="700">onDetach()</text><text x="280" y="555" text-anchor="start" fill="#52606f" font-size="13">Disconnected from the Activity</text></svg>